<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Shadow filters -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF5722" flood-opacity="0.4" />
    </filter>
    <!-- Linear gradients -->
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <linearGradient id="blue-box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6CB6" />
      <stop offset="100%" stop-color="#114A8B" />
    </linearGradient>
  </defs>

  <!-- Main Graphic Container -->
  <g transform="translate(100, 20)">
    <!-- 1. PDF Document (Left) -->
    <g transform="translate(0, 0)" filter="url(#drop-shadow)">
      <!-- Red rounded container -->
      <path d="M 30,10 L 130,10 C 138,10 145,15 150,22 L 180,56 C 186,63 190,70 190,80 L 190,230 C 190,246 176,260 160,260 L 30,260 C 14,260 0,246 0,230 L 0,40 C 0,24 14,10 30,10 Z" 
            fill="#FFFFFF" stroke="#E5252A" stroke-width="16" stroke-linejoin="round" />
      
      <!-- Top folded corner fill -->
      <path d="M 140,14 L 140,65 C 140,73 147,80 155,80 L 186,80 Z" fill="#E5252A" />

      <!-- PDF Stylized Knot Ribbon -->
      <g transform="translate(95, 155) scale(1.15)">
        <path d="M -15,-65 C -2, -50 15, -15 2, 22 C -8, 48 -35, 52 -45, 30 C -52, 12 -42, -10 -22, -18 C 15, -30 45, 15 55, 38 C 58, 45 65, 45 68, 38 C 72, 28 62, 10 38, -2 C 8, -18 -8, -50 -15,-65 Z" 
              fill="none" stroke="#E5252A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 2. Curved Red Dynamic Arrow (Center) -->
    <g transform="translate(145, 110)" filter="url(#drop-shadow)">
      <path d="M 0,90 Q 65,30 145,45 L 145,15 L 215,75 L 145,135 L 145,102 Q 80,92 18,125 Z" 
            fill="url(#arrow-grad)" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <!-- 3. Word DOCX Container (Right) -->
    <g transform="translate(255, 0)" filter="url(#drop-shadow)">
      <!-- Dark Blue Base Background Box with rounded top-right -->
      <path d="M 0,10 L 210,10 C 226,10 240,24 240,40 L 240,230 C 240,246 226,260 210,260 L 0,260 Z" 
            fill="url(#blue-box-grad)" />

      <!-- White Inner Document Sheet with folded corner effect -->
      <path d="M 45,35 L 160,35 L 195,70 L 195,235 L 45,235 Z" 
            fill="#FFFFFF" />
      <path d="M 160,35 L 160,70 L 195,70 Z" fill="#D2E3FC" />

      <!-- Left Blue Floating Word "W" Panel -->
      <g transform="translate(30, 48)" filter="url(#drop-shadow)">
        <polygon points="10,0 85,15 85,175 10,160" fill="#185ABD" />
        <!-- Big Bold "W" -->
        <text x="47" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" text-anchor="middle">W</text>
      </g>

      <!-- Horizontal Document Lines on white sheet -->
      <g transform="translate(125, 95)" fill="#185ABD">
        <rect x="0" y="0" width="55" height="8" rx="4" />
        <rect x="0" y="18" width="55" height="8" rx="4" />
        <rect x="0" y="36" width="55" height="8" rx="4" />
        <rect x="0" y="54" width="55" height="8" rx="4" />
        <rect x="0" y="72" width="38" height="8" rx="4" />
      </g>

      <!-- 4. Orange Tamil Character 'அ' Badge (Bottom Right) -->
      <g transform="translate(195, 235)" filter="url(#glow-orange)">
        <text x="15" y="32" font-family="'Noto Sans Tamil', 'Latha', 'Mukta Malar', sans-serif" font-size="64" font-weight="900" fill="#E65100" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" text-anchor="middle">அ</text>
      </g>
    </g>
  </g>

  <!-- 5. Tamify Typography Below -->
  <text x="400" y="395" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="108" font-weight="800" fill="#0B2046" text-anchor="middle" letter-spacing="-1.5px">Tamify</text>
</svg>
